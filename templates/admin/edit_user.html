{% extends "base.html" %}
{% block title %}Редактировать пользователя{% endblock %}
{% block content %}
<div class="page-header">
  <h2>✏️ Редактировать пользователя</h2>
  <a href="/admin/users" class="btn btn-secondary">← Назад</a>
</div>
<div class="card" style="max-width:500px;">
  <form method="post" action="/admin/users/{{ edit_user.id }}/edit">
    <div class="form-group">
      <label>Полное имя</label>
      <input type="text" name="full_name" value="{{ edit_user.full_name }}" required placeholder="Имя Фамилия">
    </div>
    <div class="form-group">
      <label>Роль наблюдателя <span style="color:#999; font-size:0.85rem;">(мама, папа, старшая сестра, бабушка...)</span></label>
      <input type="text" name="observer_role" value="{{ edit_user.observer_role or '' }}" placeholder="например: мама, папа, бабушка">
    </div>
    <div style="display:flex; gap:1rem; margin-top:1.5rem;">
      <button type="submit" class="btn btn-primary">💾 Сохранить</button>
      <a href="/admin/users" class="btn btn-secondary">Отмена</a>
    </div>
  </form>
</div>
{% endblock %}
