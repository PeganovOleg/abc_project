<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Вход — ABC Дневник</title>
<link rel="stylesheet" href="/static/style.css?v=3">
</head>
<body>
<div class="login-wrap">
  <div class="login-box">
    <h1>📋 ABC Дневник</h1>
    <p class="subtitle">Дневник наблюдения за поведением</p>
    {% if error %}
    <div class="alert alert-error">{{ error }}</div>
    {% endif %}
    <form method="post" action="/login">
      <div class="form-group">
        <label>Логин</label>
        <input type="text" name="username" required autofocus placeholder="Введите логин">
      </div>
      <div class="form-group">
        <label>Пароль</label>
        <input type="password" name="password" required placeholder="Введите пароль">
      </div>
      <div class="form-group consent-wrap">
        <label class="consent-label">
          <input type="checkbox" name="consent" required>
          <span>Я согласен(на) на <a href="/consent" target="_blank">обработку персональных данных</a></span>
        </label>
      </div>
      <button type="submit" class="btn btn-primary btn-full">Войти</button>
    </form>
  </div>
</div>
</body>
</html>
